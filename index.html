<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cocktail Archive</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
</head>
<body>

    <div class="header">
        <h1 style="margin: 0;">🍸 Cocktail Archive</h1>

        <div class="controls">
            <div>
                <label for="spiritFilter" style="font-weight: bold; color: #2c3e50; margin-right: 10px;">베이스 선택:</label>
                <select id="spiritFilter" class="filter-select">
                    <option value="all">모든 주류 (All)</option>
                    <option value="whiskey">위스키 (Whiskey)</option>
                    <option value="gin">진 (Gin)</option>
                    <option value="rum">럼 (Rum)</option>
                    <option value="vodka">보드카 (Vodka)</option>
                    <option value="tequila">데킬라 (Tequila)</option>
                    <option value="cognac">코냑 / 브랜디 (Cognac)</option>
                </select>
            </div>

            <div class="lang-switch">
                <button id="btnKo" class="active">한국어</button>
                <button id="btnEn">English</button>
            </div>
        </div>
    </div>

    <div id="mainContainer"></div>

    <footer class="site-footer">
        Mingyu, Kang, 2026, according to <a href="https://iba-world.com/cocktails/all-cocktails/" target="_blank">https://iba-world.com/cocktails/all-cocktails/</a>
    </footer>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <span class="close-btn" id="closeModalButton">&times;</span>
            <div class="modal-body">
                <figure class="modal-photo" id="modalPhotoSection" hidden>
                    <img id="modalPhoto" alt="">
                    <figcaption id="modalPhotoCredit"></figcaption>
                </figure>
                <div class="modal-details">
                    <h2 id="modalTitle"></h2>
                    <div class="ingredient-list">
                        <ul id="modalIngredients"></ul>
                    </div>
                    <h3 id="modalRecipeLabel">Recipe</h3>
                    <p id="modalMethod" style="line-height: 1.7; color: #444; white-space: pre-line;"></p>
                    <div id="modalGarnishSection" style="display:none;">
                        <h3 id="modalGarnishLabel">Garnish</h3>
                        <p id="modalGarnish" style="line-height: 1.7; color: #444;"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
